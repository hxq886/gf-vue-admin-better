# ==============================================================================
# gf-vue-admin-better 服务配置
# 说明: 数据库连接 / JWT密钥请按部署环境修改, 完整字段见 GF 官方配置模板
# https://goframe.org/docs/web/server-config-file-template
# ==============================================================================

server:
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level:  "error"
  stdout: true

# ------------------------------------------------------------------------------
# 数据库连接 (默认本机MySQL, 请按环境修改账号密码)
# ------------------------------------------------------------------------------
database:
  logger:
    level: "error" # SQL 日志级别, 开发调试可改为 "all"
  default:
    link: "mysql:root:@tcp(127.0.0.1:3306)/gf_vue_admin_better?charset=utf8mb4&parseTime=true"

# ------------------------------------------------------------------------------
# 跨域 (开发环境前后端分离部署时开启; 前后端同源部署/生产环境建议关闭)
# ------------------------------------------------------------------------------
cors:
  enabled: true

# ------------------------------------------------------------------------------
# JWT 鉴权 (生产环境务必修改 key)
# ------------------------------------------------------------------------------
jwt:
  key:        "gf-vue-admin-better-secret-key" # 签名密钥
  timeout:    "24h"                            # 令牌有效期
  maxRefresh: "24h"                            # 登出黑名单保留时长
